baseURL = 'https://rustvim.org/'
locale = 'en-US'
title = 'Rustvim'

# needed for og:description to be the website description (below in [params])
summaryLength = 0

[frontmatter]
  date = [":filename", ":default"]

[security]
  allowContent = ['.*']

[permalinks]
  news = "/:section/:year/:month/"

[outputs]
  section = ["html", "rss"]

[outputFormats.RSS]
  baseName = "news"
  path = "/"

[params]
  description = "a Vim-based editor evolving in Rust"
  sourceRepository = "https://github.com/tupos/rustvim"
  websiteRepository = "https://github.com/tupos/rustvim.org"

  # Used for social previews
  images = ['/logos/rustvim-logo.png']

  [params.news]
    name = "Rustvim News"
    authors = "Rustvim Contributors"
    url = "/news"
    feed = "/news.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  # XXX: somehow this accidentally enables use of the syntax palette (css/rustvim-hi.css),
  # presumably those css classes match whatever Hugo is using to provide syntax highlighting.
  [markup.highlight]
    noClasses = false

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 10
  identifier = "about"

[[menus.main]]
  name = "Vision"
  url = "/vision/"
  parent = "about"
  weight = 1

[[menus.main]]
  name = "Roadmap"
  url = "/roadmap/"
  parent = "about"
  weight = 2

[[menus.main]]
  name = "Screenshots"
  url = "/screenshots/"
  parent = "about"
  weight = 3

[[menus.main]]
  name = "News"
  url = "/news/"
  weight = 20

[[menus.main]]
  name = "Development"
  url = "https://github.com/tupos/rustvim"
  weight = 30

[[menus.main]]
  name = "Documentation"
  url = "/doc/"
  weight = 40
