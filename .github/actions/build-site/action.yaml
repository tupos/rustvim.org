name: "Build Hugo Site"
description: "Shared build logic"

runs:
  using: "composite"
  steps:
    - name: Checkout tupos/rustvim
      uses: actions/checkout@v6
      with:
        repository: tupos/rustvim
        path: 'rustvim'
    - name: Install Rust toolchain
      shell: bash
      working-directory: ./rustvim
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain none
        source "$HOME/.cargo/env"
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup show
    - name: Install Rustvim
      shell: bash
      run: |
        cd ./rustvim
        make -j"$(nproc)"
        sudo cmake --install build
    - name: Install Hugo CLI
      shell: bash
      env:
        HUGO_VERSION: "0.162.1"
      run: |
        wget -O ${{ runner.temp }}/hugo.deb \
          https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
        && sudo dpkg -i ${{ runner.temp }}/hugo.deb
    - name: Get Rustvim docs
      shell: bash
      run: |
        ./gendoc.lua ./rustvim

    # :help docs PDF, served at /doc/user/rustvim-help.pdf. After gendoc.lua, which builds the helptags.
    #
    # TODO: --generate-pdf-document-outline might be nice, but bloats size from 15 => 50 MB.
    - name: Generate help PDF
      shell: bash
      run: |
        (cd ./rustvim && nvim -V1 -es --clean +"lua require('src.gen.gen_help_html').gen('print', './runtime/doc', '${{ runner.temp }}/print')" +q)
        mkdir -p static/doc/user
        # --no-sandbox: Ubuntu restricts the user namespaces that Chrome's sandbox needs.
        google-chrome --headless --no-sandbox --no-pdf-header-footer --disable-pdf-tagging \
          --print-to-pdf=static/doc/user/rustvim-help.pdf "${{ runner.temp }}/print/print.html"
        test -s static/doc/user/rustvim-help.pdf

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Build site and search index
      shell: bash
      env:
        # For backward compatibility with Hugo modules
        HUGO_ENVIRONMENT: production
        HUGO_ENV: production
      run: |
        node scripts/build-site.mjs

