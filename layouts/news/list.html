{{ define "main" }}
<section class="front-section">
    <div class="container golden-grid">
        <div class="newsletter col-wide">

            <h1>{{ .Title }}</h1>
            {{ .Content }}

            {{ range (sort (where .CurrentSection.RegularPages "Params.upstream" true) "Date" "desc") }}
            <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
            {{ end }}

        </div>

        {{ partial "news_sidebar.html" . }}
    </div>
</section>
{{ end }}
